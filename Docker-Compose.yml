version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox
      POSTGRES_DB: reachinbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend_api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: reachinbox_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgres://reachinbox:reachinbox@postgres:5432/reachinbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    ports:
      - "4000:4000"
    command: ["npm", "run", "dev"]

  backend_worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: reachinbox_backend_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgres://reachinbox:reachinbox@postgres:5432/reachinbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    command: ["npm", "run", "worker"]

volumes:
  postgres_data:
  redis_data: